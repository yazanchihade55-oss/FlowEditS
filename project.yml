name: FlowEdit
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  FlowEdit:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["*.yml", "*.md", ".github/**", "build/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flowedit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Zum Speichern exportierter Videos"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
